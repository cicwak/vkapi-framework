name: release

on:
  release:
    types: [released, prereleased]

permissions:
  contents: read

jobs:
  checks:
    name: checks / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  lint:
    name: lint and types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy

      - name: Run Pyrefly
        run: pyrefly check --output-format=github --summarize-errors

  build:
    name: build distribution
    runs-on: ubuntu-latest
    needs: [checks, lint]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[release]"

      - name: Verify release tag matches package version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          tag = "${{ github.event.release.tag_name }}"
          expected = tag.removeprefix("v")
          text = Path("pyproject.toml").read_text()
          match = re.search(r'(?m)^version = "([^"]+)"$', text)
          if match is None:
              raise SystemExit("Cannot find project version in pyproject.toml")
          actual = match.group(1)
          if actual != expected:
              raise SystemExit(
                  f"Release tag {tag!r} does not match pyproject version {actual!r}"
              )
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.release.prerelease }}
    environment:
      name: testpypi
      url: https://test.pypi.org/project/vkapi-framework/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !github.event.release.prerelease }}
    environment:
      name: pypi
      url: https://pypi.org/project/vkapi-framework/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
