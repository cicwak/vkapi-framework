name: Release -> (Test)PyPI + GitHub Assets

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  checks:
    name: checks / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  lint:
    name: lint and types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy

      - name: Run Pyrefly
        run: pyrefly check --output-format=github --summarize-errors

  build:
    name: build distribution
    runs-on: ubuntu-latest
    needs: [checks, lint]
    outputs:
      repo: ${{ steps.meta.outputs.repo }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set variables from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ (a|b|rc|dev)[0-9]* ]]; then
            echo "repo=testpypi" >> "$GITHUB_OUTPUT"
          else
            echo "repo=pypi" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved: version=$VERSION"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[release]"

      - name: Sync version into pyproject.toml
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("pyproject.toml")
          version = "${{ steps.meta.outputs.version }}"
          text = path.read_text()
          text = re.sub(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          path.write_text(text)
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.meta.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.repo == 'testpypi' }}
    environment:
      name: testpypi
      url: https://test.pypi.org/project/vkapi-framework/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.repo == 'pypi' }}
    environment:
      name: pypi
      url: https://pypi.org/project/vkapi-framework/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: upload GitHub release assets
    runs-on: ubuntu-latest
    needs: [build, publish-testpypi, publish-pypi]
    if: ${{ always() && needs.build.result == 'success' && (needs.publish-testpypi.result == 'success' || needs.publish-testpypi.result == 'skipped') && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped') }}
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.build.outputs.repo == 'testpypi' }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
