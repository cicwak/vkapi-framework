[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vkapi-framework"
version = "0.1.0"
description = "Async-first VK API SDK and bot framework inspired by aiogram 3"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Konstantin Ponomarev", email = "cicwak@gmail.com" }]
keywords = ["vk", "vkontakte", "api", "bot", "asyncio", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "aiohttp>=3.9,<4",
  "pydantic>=2.4,<3",
  "typing-extensions>=4.8,<5",
]

[project.optional-dependencies]
fast = ["orjson>=3.10"]
redis = ["redis[hiredis]>=5,<8"]
docs = ["sphinx>=7"]
release = [
  "build>=1.2",
  "twine>=6.0",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.8",
  "mypy>=1.13",
  "pyrefly>=1",
  "build>=1.2",
  "twine>=6.0",
]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/docs",
  "/pyproject.toml",
  "/scripts",
  "/src/vkapi",
  "/tests",
]
exclude = [
  "/docs/_build",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vkapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 99
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "PERF", "RET", "SIM", "UP"]
ignore = [
  "A002",
  "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["vkapi"]

[tool.ruff.lint.per-file-ignores]
"src/vkapi/methods/generated.py" = ["E501"]
"docs/conf.py" = ["A001"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
show_error_codes = true
show_error_context = true
pretty = true
strict = true
warn_unreachable = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true
extra_checks = true

[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
project-excludes = ["docs/_build", "dist", "build"]
search-path = ["src"]
python-version = "3.11"
python-platform = "linux"
ignore-errors-in-generated-code = true
