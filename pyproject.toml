[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vkapi"
version = "0.1.0"
description = "Async-first VK API SDK and bot framework inspired by aiogram 3"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{ name = "Konstantin Ponomarev", email = "cicwak@gmail.com" }]
keywords = ["vk", "vkontakte", "api", "bot", "asyncio", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Typing :: Typed",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiohttp>=3.9,<4",
  "pydantic>=2.4,<3",
  "typing-extensions>=4.8,<5",
]

[project.optional-dependencies]
fast = ["orjson>=3.10"]
redis = ["redis[hiredis]>=5,<8"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vkapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 99
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "PERF", "RET", "SIM", "UP"]
ignore = [
  "A002",
  "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["vkapi"]

[tool.ruff.lint.per-file-ignores]
"src/vkapi/methods/generated.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
show_error_codes = true
ignore_missing_imports = true
strict = false
